[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'No build step required'"

[functions]
  node_bundler = "esbuild"

# Public content-flag acknowledgment link (/acknowledge?token=...) is
# handled client-side in app.js - rewrite it to index.html so the SPA loads.
[[redirects]]
  from = "/acknowledge"
  to = "/index.html"
  status = 200
